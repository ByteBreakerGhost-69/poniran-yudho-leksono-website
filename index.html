function renderGallery(){const list=filtered(),body=$("#gallery-body");if(!list.length){body.innerHTML='<p class="empty">'+t("empty")+'</p>';return}if(state.view==="album"){body.innerHTML='<div class="albums">'+list.map((e,n)=>'<button type="button" class="album reveal zoom" style="--d:'+((n%3)*0.1)+'s" data-open="'+e.id+'" data-i="0"><span class="cover"><img loading="lazy" src="'+photoSrc(e,0)+'" alt=""><span class="count">'+t("photos")(e.photos)+'</span></span><span class="body">'+metaHtml(e).replace(/<div/g,"<span").replace(/<\/div>/g,"</span>")+'<span class="t">'+tx(e.title)+'<span class="sample">'+t("sample")+'</span></span><span class="d">'+tx(e.desc)+'</span></span></button>').join("")+'</div>'}else if(state.view==="grid"){let tiles="",tn=0;list.forEach(e=>{for(let i=0;i<e.photos;i++){tiles+='<button type="button" class="tile reveal zoom" style="--d:'+((tn++%6)*0.05)+'s" data-open="'+e.id+'" data-i="'+i+'" aria-label="'+t("photoOf")(tx(e.title),i+1)+'"><img loading="lazy" src="'+photoSrc(e,i)+'" alt=""><span>'+tx(e.title)+'</span></button>'}});body.innerHTML='<div class="tiles">'+tiles+'</div>'}else{let html='<div class="tl">',year="";list.forEach(e=>{const y=e.date.slice(0,4);if(y!==year){if(year)html+='</ol>';html+='<h3 class="tl-year">'+y+'</h3><ol class="tl" style="list-style:none;margin:0;padding:0">';year=y}let th="";for(let i=0;i<Math.min(3,e.photos);i++)th+='<button type="button" data-open="'+e.id+'" data-i="'+i+'" aria-label="'+t("photoOf")(tx(e.title),i+1)+'"><img loading="lazy" src="'+photoSrc(e,i)+'" alt=""></button>';html+='<li class="tl-item reveal from-left">'+metaHtml(e)+'<h3>'+tx(e.title)+'<span class="sample">'+t("sample")+'</span></h3><p>'+tx(e.desc)+'</p><div class="tl-thumbs">'+th+'</div><button type="button" class="tl-open" data-open="'+e.id+'" data-i="0">'+t("openAlbum")+' ('+t("photos")(e.photos)+')</button></li>'});html+='</ol></div>';body.innerHTML=html}}
const dlg=$("#lb");let lb={ev:null,i:0};function openLb(id,i){lb.ev=EVENTS.find(e=>e.id===id);lb.i=i;renderLb();if(!dlg.open)dlg.showModal()}function renderLb(){if(!lb.ev)return;const e=lb.ev;$("#lb-img").src=photoSrc(e,lb.i);$("#lb-img").alt=t("photoOf")(tx(e.title),lb.i+1);$("#lb-meta").innerHTML='<span class="cat">'+t("cats")[e.cat]+'</span><span>'+fmtDate(e.date)+'</span>';$("#lb-title").textContent=tx(e.title);$("#lb-desc").textContent=tx(e.desc);$("#lb-count").textContent=t("counter")(lb.i+1,e.photos);$("#lb-thumbs").innerHTML=Array.from({length:e.photos},(_,i)=>'<button type="button" data-lb-i="'+i+'" aria-current="'+(i===lb.i)+'"><img src="'+photoSrc(e,i)+'" alt=""></button>').join("")}
function closeLb(){if(dlg.open)dlg.close()}function nextLb(){if(!lb.ev)return;lb.i=(lb.i+1)%lb.ev.photos;renderLb()}function prevLb(){if(!lb.ev)return;lb.i=(lb.i-1+lb.ev.photos)%lb.ev.photos;renderLb()}
document.addEventListener("click",e=>{const lang=e.target.closest("[data-lang]");if(lang){state.lang=lang.dataset.lang;try{localStorage.setItem("lang",state.lang)}catch(err){}applyStatic();renderCV();renderCourses();renderResearch();renderTools();renderGallery();renderLb();return}const v=e.target.closest("[data-view]");if(v){state.view=v.dataset.view;renderTools();renderGallery();return}const c=e.target.closest("[data-cat]");if(c){state.cat=c.dataset.cat;renderTools();renderGallery();return}const op=e.target.closest("[data-open]");if(op){openLb(op.dataset.open,Number(op.dataset.i||0));return}const th=e.target.closest("[data-lb-i]");if(th){lb.i=Number(th.dataset.lbI);renderLb();return}if(e.target.closest("#lb-close")){closeLb();return}if(e.target.closest("#lb-next")){nextLb();return}if(e.target.closest("#lb-prev")){prevLb();return}if(e.target.closest("#quick-fab")){const f=$("#quick-fab"),m=$("#quick-menu"),open=f.getAttribute("aria-expanded")==="true";f.setAttribute("aria-expanded",String(!open));m.hidden=open}});dlg.addEventListener("click",e=>{if(e.target===dlg)closeLb()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();if(e.key==="ArrowRight")nextLb();if(e.key==="ArrowLeft")prevLb()});
$("#contact-form").addEventListener("submit",e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),name=fd.get("name"),email=fd.get("email"),msg=fd.get("msg");location.href="mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent(t("mailSubject"))+"&body="+encodeURIComponent((state.lang==="id"?"Nama: ":"Name: ")+name+"\n"+(state.lang==="id"?"Email: ":"Email: ")+email+"\n\n"+msg)});
$("#c-tel").href="tel:"+CONTACT_PHONE;$("#c-mail").href="mailto:"+CONTACT_EMAIL;$("#q-tel").href="tel:"+CONTACT_PHONE;$("#q-mail").href="mailto:"+CONTACT_EMAIL;
function onScroll(){const y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;$("#progress").style.transform="scaleX("+Math.max(0,Math.min(1,y/(h||1)))+")";$(".site-header").classList.toggle("scrolled",y>6)}window.addEventListener("scroll",onScroll,{passive:true});
function reveal(){document.querySelectorAll(".reveal").forEach(el=>{if(el.classList.contains("in"))return;const r=el.getBoundingClientRect();if(r.top<innerHeight*.92)el.classList.add("in")})}window.addEventListener("scroll",reveal,{passive:true});window.addEventListener("resize",reveal);applyStatic();renderHero();renderCV();renderCourses();renderResearch();renderTools();renderGallery();reveal();onScroll();
(function(){const map=[["#top","home"],["#tentang","about"],["#pengajaran","academic"],["#galeri","gallery"],["#kontak","contact"]],links=[...document.querySelectorAll("[data-spy]")],quick=$("#quick");function mark(id){links.forEach(a=>a.setAttribute("aria-current",String(a.dataset.spy===id)));quick.classList.toggle("hide",id==="contact"||id==="home")}const spy=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting)mark(en.target.dataset.spyId)})},{rootMargin:"-45% 0px -50% 0px"});map.forEach(([sel,id])=>{const el=$(sel);if(el){el.dataset.spyId=id;spy.observe(el)}});mark("home")})();
</script>
